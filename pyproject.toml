[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biointel"
version = "0.1.0"
description = "Autonomous Biotechnology Intelligence & Commercialization Research Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
biointel = "biointel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
